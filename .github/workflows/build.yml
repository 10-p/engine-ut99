name: build

# CI for the engine build matrix: builds native, windows and wasm on every push and pull request, uploads the
# binaries as workflow artifacts, and keeps the newest build of a tracked branch in a rolling `latest` release.
#
# It does not run the game (the web E2E suite needs a GPU, which a hosted runner lacks): it proves every target
# builds, that the Windows exe is self-contained and that the web artifact's provenance is right.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (32-bit, one static binary)
    runs-on: ubuntu-24.04
    # A container, not the bare runner: the runner image's preinstalled amd64 -dev packages make
    # `libsdl2-dev:i386` uninstallable (libglib2.0-dev-bin is Multi-Arch: foreign). A stock ubuntu:24.04
    # resolves the multiarch set.
    container: ubuntu:24.04
    # A container job defaults to `sh -e`, and dash has no `set -o pipefail`: pin bash.
    defaults:
      run:
        shell: bash
    steps:
      # The image is bare: even git has to be installed before checkout can use it.
      - name: Base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates cmake make g++ pkg-config

      - uses: actions/checkout@v4

      # The engine variant comes from the source (ENGINE_VERSION in UnObjVer.h), not from the branch name.
      # `tail -1`: on the 436 branch the define sits inside an #ifndef.
      - name: Identify the engine variant
        id: variant
        run: |
          set -euo pipefail
          v=$(sed -n 's/^#define ENGINE_VERSION[[:space:]]\+\([0-9]\+\).*/\1/p' Source/Core/Inc/UnObjVer.h | tail -1)
          test -n "$v" || { echo "::error::could not read ENGINE_VERSION from Source/Core/Inc/UnObjVer.h"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Engine variant: v$v"

      # The engine is a 32-bit build (-m32), so every dev package it links has to be the :i386 one.
      - name: Install the 32-bit toolchain
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib libsdl2-dev:i386 libopenal-dev:i386

      # FetchContent clones into the build dir, so cache that rather than a home directory. Keyed on the
      # files that decide what is fetched — a pin bump invalidates it, an unrelated source edit does not.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-native/_deps
          key: deps-native-${{ hashFiles('Source/CMakeLists.txt', 'Source/*/CMakeLists.txt', 'Source/cmake/*.cmake') }}

      - name: Configure
        run: cmake --preset native
        working-directory: Source

      - name: Build
        run: cmake --build --preset native -j$(nproc)
        working-directory: Source

      - name: Check it really is one binary
        run: |
          test -x build-native/UnrealTournament/UnrealTournament
          test -x build-native/UCC/ucc-bin   # the command-line tool (dedicated server / commandlets)
          # BUILD_STATIC means no engine packages beside the executable; system libraries (SDL2, libGL,
          # libc) stay dynamic.
          if ls build-native/*/*.so >/dev/null 2>&1; then
            echo "::error::engine .so modules were produced — BUILD_STATIC is not in effect"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ut99-${{ steps.variant.outputs.version }}-linux
          path: |
            build-native/UnrealTournament/UnrealTournament
            build-native/UCC/ucc-bin
          if-no-files-found: error
          # Seven days keeps the artifact storage under its quota (the default 90 days fills it); the
          # newest build stays downloadable through the `latest` job at the end of this file.
          retention-days: 7

  windows:
    name: windows (MinGW-w64 cross, one self-contained .exe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The engine variant comes from the source (ENGINE_VERSION in UnObjVer.h), not from the branch name.
      # `tail -1`: on the 436 branch the define sits inside an #ifndef.
      - name: Identify the engine variant
        id: variant
        run: |
          set -euo pipefail
          v=$(sed -n 's/^#define ENGINE_VERSION[[:space:]]\+\([0-9]\+\).*/\1/p' Source/Core/Inc/UnObjVer.h | tail -1)
          test -n "$v" || { echo "::error::could not read ENGINE_VERSION from Source/Core/Inc/UnObjVer.h"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Engine variant: v$v"

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-windows/_deps
          key: deps-windows-${{ hashFiles('Source/CMakeLists.txt', 'Source/*/CMakeLists.txt', 'Source/cmake/*.cmake') }}

      - name: Configure
        run: cmake --preset windows
        working-directory: Source

      - name: Build
        run: cmake --build --preset windows -j$(nproc)
        working-directory: Source

      # The exe must import only system DLLs (without -static-libgcc / -static-libstdc++ it would need
      # the toolchain's libgcc_s and libstdc++, and nothing else in the build would fail).
      - name: Assert the exe imports nothing but system DLLs
        run: |
          set -euo pipefail
          imports=$(i686-w64-mingw32-objdump -p build-windows/UnrealTournament/UnrealTournament.exe \
                    | sed -n 's/^\tDLL Name: //p' | sort -u)
          echo "$imports"
          # OpenAL32.dll is the one library this build ships beside the exe (Source/cmake/OpenALMingw.cmake).
          bad=$(echo "$imports" | grep -viE '^(ADVAPI32|GDI32|IMM32|KERNEL32|msvcrt|ole32|OLEAUT32|OPENGL32|OpenAL32|SETUPAPI|SHELL32|USER32|VERSION|WINMM|WS2_32)\.dll$' || true)
          if [ -n "$bad" ]; then echo "::error::non-system DLL imports: $bad"; exit 1; fi
          test -f build-windows/UnrealTournament/OpenAL32.dll

      # ucc-bin.exe, the console tool, needs no DLL beside it: system DLLs only.
      - name: Assert ucc-bin.exe imports nothing but system DLLs
        run: |
          set -euo pipefail
          imports=$(i686-w64-mingw32-objdump -p build-windows/UCC/ucc-bin.exe | sed -n 's/^\tDLL Name: //p' | sort -u)
          echo "$imports"
          bad=$(echo "$imports" | grep -viE '^(ADVAPI32|GDI32|IMM32|KERNEL32|msvcrt|ole32|OLEAUT32|SETUPAPI|SHELL32|USER32|VERSION|WINMM|WS2_32)\.dll$' || true)
          if [ -n "$bad" ]; then echo "::error::non-system DLL imports: $bad"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ut99-${{ steps.variant.outputs.version }}-windows
          path: |
            build-windows/UnrealTournament/UnrealTournament.exe
            build-windows/UnrealTournament/OpenAL32.dll
            build-windows/UCC/ucc-bin.exe
          if-no-files-found: error
          # Seven days keeps the artifact storage under its quota (the default 90 days fills it); the
          # newest build stays downloadable through the `latest` job at the end of this file.
          retention-days: 7

  web:
    name: web (Emscripten)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The engine variant comes from the source (ENGINE_VERSION in UnObjVer.h), not from the branch name.
      # `tail -1`: on the 436 branch the define sits inside an #ifndef.
      - name: Identify the engine variant
        id: variant
        run: |
          set -euo pipefail
          v=$(sed -n 's/^#define ENGINE_VERSION[[:space:]]\+\([0-9]\+\).*/\1/p' Source/Core/Inc/UnObjVer.h | tail -1)
          test -n "$v" || { echo "::error::could not read ENGINE_VERSION from Source/Core/Inc/UnObjVer.h"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Engine variant: v$v"

      # emsdk must be on PATH before cmake configures (emcc is probed then); the preset's toolchain
      # file also reads $EMSDK.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.7
          actions-cache-folder: emsdk-cache

      # A fresh emsdk has an empty ports cache, and the SDL2 port's headers land in the sysroot only
      # once the port is built.
      - name: Build the SDL2 port into the emsdk sysroot
        run: embuilder build sdl2

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-wasm/_deps
          key: deps-wasm-${{ hashFiles('Source/CMakeLists.txt', 'Source/*/CMakeLists.txt', 'Source/cmake/*.cmake') }}

      # No game assets are needed: the web link preloads only the tracked web config (Config/System/web).
      - name: Configure
        run: cmake --preset wasm
        working-directory: Source

      - name: Build
        run: cmake --build --preset wasm -j$(nproc)
        working-directory: Source

      # meta.json's gitSha must be the commit actually built.
      - name: Check artifact provenance
        run: |
          set -euo pipefail
          sha=$(python3 -c "import json;print(json.load(open('build-wasm/SDLLaunch/meta.json'))['provenance']['gitSha'])")
          echo "meta.json gitSha=$sha  HEAD=$GITHUB_SHA"
          case "$GITHUB_SHA" in "$sha"*) ;; *) echo "::error::meta.json gitSha does not match HEAD"; exit 1;; esac

      - uses: actions/upload-artifact@v4
        with:
          name: ut99-${{ steps.variant.outputs.version }}-web
          path: build-wasm/SDLLaunch/
          if-no-files-found: error
          # Seven days keeps the artifact storage under its quota (the default 90 days fills it); the
          # newest build stays downloadable through the `latest` job at the end of this file.
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The rolling "latest" release: the newest build of a tracked branch, kept until
  # the next one replaces it. Artifacts expire by age only; release assets do not.
  #
  # Delete-then-create: a rolling tag has to move, and `gh release edit --target`
  # does not move a published release's tag; recreating it also drops assets that
  # are no longer produced.
  #
  # `permissions: contents: write` is required: the default workflow token is
  # read-only.
  android:
    name: android (arm64 + arm32 APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # JDK 17: the Gradle daemon's (Android/gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Only platform-tools: the action's default list names `tools`, which the current SDK repository does not
      # have. The NDK and CMake come from the next step.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # The NDK and the CMake the Gradle plugin asks for; the NDK version matches app/build.gradle's ndkVersion,
      # because AGP silently downloads its own on a mismatch. CI writes its own local.properties for this
      # runner's SDK.
      - name: Install the NDK + CMake and point the build at this runner's SDK
        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;4.1.2" >/dev/null
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/28.2.13676358\n' "$ANDROID_HOME" "$ANDROID_HOME" > Android/local.properties

      # The Gradle project's ABI set (armeabi-v7a, arm64-v8a, x86_64).
      - name: Build the APK
        run: ./gradlew assembleDebug --console=plain
        working-directory: Android

      - name: Assert both ABIs are packaged
        run: |
          set -euo pipefail
          apk=Android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libUT99.so" || { echo "::error::missing arm64-v8a"; exit 1; }
          unzip -l "$apk" | grep -q "lib/armeabi-v7a/libUT99.so" || { echo "::error::missing armeabi-v7a"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ut99-android
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  latest:
    name: rolling "latest" release
    needs: [linux, windows, web, android]
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'feat/v436-compat')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Every artifact this run produced, each in its own directory named after it.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack one zip per build
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          n=0
          for d in artifacts/*/; do
            name=$(basename "$d")
            ( cd "$d" && zip -qr "$GITHUB_WORKSPACE/out/$name.zip" . )
            n=$((n + 1))
          done
          # A release that publishes nothing fails the job.
          [ "$n" -gt 0 ] || { echo "::error::no artifacts were downloaded — nothing to publish"; exit 1; }
          echo "packed $n build(s):"
          ls -la out/

      - name: Publish (replacing the previous one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One rolling tag per tracked branch, so branches cannot overwrite each
          # other's "latest". The default branch keeps the bare name.
          if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ]; then
            tag="latest"
          else
            tag="latest-$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          fi
          echo "tag: $tag"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" out/*.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$tag — $(git log -1 --format=%s | cut -c1-72)" \
            --notes "$(printf '%s\n' \
              "The newest UT99 engine build of \`$GITHUB_REF_NAME\`, rebuilt and replaced on every push." \
              "" \
              "Commit: \`$GITHUB_SHA\`" \
              "Built: $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              "" \
              "These assets do not expire. The per-push artifacts on the run page do, after 7 days.")"
