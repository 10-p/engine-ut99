[ufront.AutoFOV]
; Aspect-correct field of view. UE1 pins the horizontal FOV and derives the vertical one from the
; aspect, so a wide window shows less vertically; AutoFOV re-derives the horizontal FOV from the live
; aspect so the vertical one stays put. Applied only while drawing, so mouse sensitivity (which script
; derives from the FOV) is unaffected. Set from outside with -ini:<File>:[ufront.AutoFOV]:<Key>=<Value>.
;   AutoFOV         0 = off (stock), 1 = Hor+, 2 = Adaptive (default): Hor+ at or above
;                   ReferenceAspect, stock below it.
;   ReferenceAspect the aspect the game was designed for; 1.333333 renders as stock.
;   WeaponScale     viewmodel FOV: 1.0 = follow the corrected view (keeps its 4:3 proportions),
;                   0.0 = the stock FOV. Blended in tan space.
;   AutoFOVUI       HUD auto-scale: 1 = on (default), 0 = off. Multiplies the HUD's own HudScale by
;                   Ref/Aspect, so widgets size by height while positions stay put. Clamped at 1: at or
;                   below ReferenceAspect the HUD renders as stock.
;   UIScale         an extra multiplier; 1.0 = the computed value.
AutoFOV=2
ReferenceAspect=1.333333
WeaponScale=1.000000
AutoFOVUI=1
UIScale=1.000000


